[project]
name = "genebreaker"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Brad W", email = "bradw@example.com" }
]
dependencies = [
    "configparser>=7.0.0",
    "flask>=3.0.3",
    "requests>=2.32.3",
    "werkzeug>=3.0.3",
    "flask-cors>=4.0.1",
    "flask-limiter>=3.8.0",
    "setuptools>=72.2.0",
    "datetime==4.3",
    "lxml==4.9.4",
    "biopython>=1.83",
]

readme = "README.md"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/genebreaker"]
